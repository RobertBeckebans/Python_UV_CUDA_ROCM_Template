[project]
name = "myproject"
version = "1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13" # select 3.12
dependencies = [
    "pytorch-triton-rocm>=3.1.0", 
    "torch==2.8.0",
    "torchvision==0.23.0"
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-rocm" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm" }]